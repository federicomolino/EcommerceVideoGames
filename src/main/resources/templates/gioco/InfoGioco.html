<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <title>InfoGioco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/CSS/InfoGiocoCSS/InfoGioco.css">
</head>
<body>

<div th:replace="~{navbar/navbar :: navbar}"></div>

<div class="container py-4">

  <!-- SUCCESS MESSAGE -->
  <div th:if="${successMessage}"
       class="alert alert-success alert-dismissible fade show col-12 col-md-8 col-lg-6 mx-auto small">
    <span th:text="${successMessage}">OK</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <!-- ERROR MESSAGE -->
  <div th:if="${errorMessage}"
       class="alert alert-danger alert-dismissible fade show col-12 col-md-8 col-lg-6 mx-auto small">
    <span th:text="${errorMessage}">OK</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- HEADER -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">

    <h2 class="fw-semibold fs-4 mb-0"
        th:text="'Info: ' + ${gioco.titolo}">
      Info
    </h2>

    <div sec:authorize="hasAuthority('ADMIN')"
         class="d-flex align-items-center gap-2 small">
      <span class="text-muted">Modifica Gioco</span>
      <a class="btn btn-outline-primary btn-sm py-1 px-2"
         th:href="@{/gioco/editGioco/{idGioco}(idGioco=${gioco.idGioco})}">
        ✏️
      </a>
    </div>

  </div>

  <div class="row g-4">

    <!-- INFO GIOCO -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card border-0 shadow-sm rounded-3 p-4 h-100 small">

        <h5 class="text-primary fw-semibold fs-6 mb-3">
          Dettagli Gioco
        </h5>

        <p class="mb-2">
          <strong>Descrizione:</strong><br>
          <span th:text="${gioco.descrizione}"></span>
        </p>

        <p class="mb-2">
          <strong>Prezzo:</strong>
          <span th:text="${gioco.prezzo}"></span> €
        </p>

        <p class="mb-2">
          <strong>Codice Prodotto:</strong>
          <span th:text="${gioco.codiceProdotto}"></span>
        </p>

        <p class="mb-2">
          <strong>Quantità:</strong>
          <span th:text="${gioco.quantita}"></span>
        </p>

        <p class="mb-2" th:if="${!gioco.softwareHouse.isEmpty}">
          <strong>Software House:</strong>
          <span th:text="${gioco.softwareHouse}"></span>
        </p>

        <p class="mb-2" th:if="${gioco.dataUscitaGioco != null}">
          <strong>Data Uscita:</strong>
          <span th:text="${gioco.dataUscitaGioco}"></span>
        </p>

        <!-- AGGIUNGI AL CARRELLO -->
        <div class="d-grid mt-3">
          <button
            th:data-id="${gioco.idGioco}"
            onclick="aggiungiAlCarrello(this.dataset.id)"
            class="btn btn-warning btn-sm fw-semibold py-2">
            🛒 Aggiungi al Carrello
          </button>
        </div>

      </div>
    </div>

    <!-- PIATTAFORME -->
    <div th:if="${parametri?.['ABILITA_PIATTAFORMA']} == true"
         th:unless="${#lists.isEmpty(listPiattaforma)}"
         class="col-12 col-md-6 col-lg-4">

      <div class="card border-0 shadow-sm rounded-3 p-4 h-100 small">
        <h5 class="text-primary fw-semibold fs-6 mb-3">
          Disponibile su
        </h5>

        <ul class="list-group list-group-flush small">
          <li th:each="piattaforma : ${listPiattaforma}"
              class="list-group-item px-0"
              th:text="${piattaforma.nomePiattaforma}">
          </li>
        </ul>
      </div>
    </div>

    <!-- SCELTA PIATTAFORMA (solo se più di 2) -->
    <div th:if="${#lists.size(listPiattaforma) >= 2}"
         class="col-12 col-md-6 col-lg-4">
      <div class="card border-0 shadow-sm rounded-3 p-4 h-100 small">
        <h5 class="text-primary fw-semibold fs-6 mb-3">
          Seleziona Piattaforma
        </h5>
        <select name="piattaformaId" class="form-select form-select-sm" id="piattaformaSelect" required>
          <option value="" selected disabled>Seleziona piattaforma</option>
          <option th:each="piattaforma : ${listPiattaforma}"
                  th:value="${piattaforma.id_piattaforma}"
                  th:text="${piattaforma.nomePiattaforma}">
          </option>
        </select>
      </div>
    </div>

  </div>

  <!-- RECENSIONI -->
  <div class="mt-5">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-2">

      <h4 class="fw-semibold text-primary fs-5 mb-0">
        Recensioni
      </h4>

      <a th:href="@{/gioco/addRecensione/{id}(id=${gioco.idGioco})}"
         class="btn btn-outline-primary btn-sm py-1 px-2">
        + Aggiungi Recensione
      </a>

    </div>

    <div th:if="${listRecensioni.isEmpty}"
         class="alert alert-warning shadow-sm small">
      Nessuna recensione presente
    </div>

    <div th:unless="${listRecensioni == null or listRecensioni.isEmpty}"
         class="row g-3">

      <div th:each="recensioni : ${listRecensioni}"
           class="col-12 col-md-6 col-lg-4">

        <div class="card border-0 shadow-sm rounded-3 h-100 small">
          <div class="card-body p-3">

            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="fw-semibold text-dark"
                    th:text="${recensioni.utente.username}">
              </span>

              <small class="text-muted"
                     th:text="${recensioni.dataRecensione}">
              </small>
            </div>

            <p class="mb-0 text-muted"
               th:text="${recensioni.recensione}">
            </p>

          </div>
        </div>

      </div>

    </div>

  </div>

</div>

<!-- TOAST CONFERMA CARRELLO -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="toastCarrello"
       class="toast align-items-center text-bg-success border-0 small">
    <div class="d-flex">
      <div class="toast-body">
        Gioco aggiunto al carrello con successo!
      </div>
      <button type="button"
              class="btn-close btn-close-white me-2 m-auto"
              data-bs-dismiss="toast">
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function aggiungiAlCarrello(idGioco) {
    const piattaformaSelect = document.getElementById("piattaformaSelect");
    const piattaformaId = piattaformaSelect ? piattaformaSelect.value : 0;

    let url = '/api/v1/carrello/add/' + idGioco;
    if (piattaformaId !== null && piattaformaId !== undefined) {
        url += '?piattaformaId=' + piattaformaId;
    }

    fetch(url, { method: 'POST' })
        .then(async response => {
            const message = await response.text();
            const toastEl = document.getElementById('toastCarrello');
            toastEl.querySelector('.toast-body').textContent = message;
            const toast = new bootstrap.Toast(toastEl);

            if (response.ok) {
                toastEl.classList.remove('bg-danger');
                toastEl.classList.add('bg-success');
            } else {
                toastEl.classList.remove('bg-success');
                toastEl.classList.add('bg-danger');
            }

            toast.show();
        })
        .catch(error => {
            const toastEl = document.getElementById('toastCarrello');
            toastEl.querySelector('.toast-body').textContent = "Errore di connessione";
            toastEl.classList.remove('bg-success');
            toastEl.classList.add('bg-danger');
            new bootstrap.Toast(toastEl).show();
        });
}
</script>

</body>
</html>
