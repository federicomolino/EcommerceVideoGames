<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Preferiti</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- CSS -->
  <style>
    .btn-trasparente {
      background-color: transparent;
      border: 2px solid #198754;
      color: #198754;
      transition: all 0.3s ease;
    }

    .btn-trasparente:hover {
      background-color: #198754;
      color: white;
    }

    .btn-trasparente:focus,
    .btn-trasparente:active {
      box-shadow: none;
    }
  </style>
</head>
<body>
<!--importo navbar-->
<div th:replace="~{navbar/navbar :: sidebar}">
  <div th:fragment="content">
    <!-- CONTENUTO -->
    <div class="container my-5">
      <div class="row g-4">

        <!-- Lista vuota -->
        <div th:if="${listPreferiti == null or #lists.isEmpty(listPreferiti)}">
          <div class="alert alert-light text-center">
            La lista dei preferiti è vuota
          </div>
        </div>

        <!-- Lista piena -->
        <div th:if="${listPreferiti != null and !#lists.isEmpty(listPreferiti)}" class="row g-4">

          <div th:each="listPre : ${listPreferiti}" class="col-12 col-sm-6 col-md-4 col-lg-3">

            <div class="card h-100">
              <div class="card-body">

                <!-- Titolo + stellina -->
                <div class="d-flex justify-content-between">
                  <h5 class="card-title" th:text="${listPre.gioco.titolo}">Titolo</h5>

                  <button
                          class="btn btn-link p-0 border-0 star-btn"
                          data-bs-toggle="modal"
                          data-bs-target="#confermaModal"
                          data-action="removePreferiti"
                          data-body="Vuoi togliere il gioco dai preferiti?"
                          th:data-id="${listPre.id}">

                    <i class="bi bi-star-fill" style="color: #FFD700;"></i>
                  </button>
                </div>

                <div>
                  <p class="card-text" th:text="${listPre.gioco.prezzo} + ' €'">12</p>
                  <p class="card-text" th:text="${listPre.piattaforma != null ? listPre.piattaforma.nomePiattaforma : '&nbsp;'}">prova</p>
                </div>

                <!-- Bottone carrello -->
                <div class="text-end">
                  <button
                          class="btn btn-trasparente btn-sm"
                          data-bs-toggle="modal"
                          data-bs-target="#confermaModal"
                          data-body="Vuoi aggiungere questo gioco al carrello?"
                          data-action="addCarrello"
                          th:data-id="${listPre.gioco.idGioco}"
                          th:data-piattaforma="${listPre.piattaforma != null ? listPre.piattaforma.id_piattaforma : ''}"
                          th:data-lista="${listPre.id}">

                    <i class="bi bi-cart">&nbsp;Aggiungi al carrello</i>
                  </button>
                </div>

              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    let datiPulsante = {};

    // Intercetta quando si apre qualsiasi modal
    document.addEventListener('show.bs.modal', function(e) {

     const trigger = e.relatedTarget;
      if (!trigger) return;

      if (e.target.id === 'confermaModal') {
        datiPulsante = {
          idGioco: e.relatedTarget.getAttribute('data-id'),
          piattaforma: e.relatedTarget.getAttribute('data-piattaforma'),
          idLista: e.relatedTarget.getAttribute('data-lista'),
          action: trigger.dataset.action
        };
      }

      // 👉 testo dinamico
      const bodyText = trigger.getAttribute('data-body');
      if (bodyText) {
        e.target.querySelector('.modal-body').innerText = bodyText;
      }
    });

    document.addEventListener('click', function(e) {
      const btn = e.target.closest('#confermaBtn');
      if (!btn) return;

      const { idGioco, piattaforma, idLista, action } = datiPulsante;

      let url = '';
      let method = 'POST';

      switch (action) {

        case 'addCarrello':
          url = `/api/v1/carrello/spostaNelCarrello/${idGioco}/${idLista}`;
          if (piattaforma) url += `?piattaforma=${piattaforma}`;
          break;

        case 'removePreferiti':
          <!--Se entra qui idGioco fa riferimento al singolo id della "lista_desideri_gioco" non del gioco -->
          url = `/api/v1/listaDesideri/rimuovi/${idGioco}`;
          method = 'DELETE';
          break;

        default:
          console.error("Azione non riconosciuta");
          return;
      }

      fetch(url, { method })
        .then(async res => {
          const text = await res.text();
          if (!res.ok) throw new Error(text || 'Errore server');
          return text;
        })
        .then(msg => {
          const toastEl = document.getElementById('toastCarrello');
          toastEl.querySelector('.toast-body').textContent = msg;

          toastEl.classList.remove('bg-danger');
          toastEl.classList.add('bg-success');

          new bootstrap.Toast(toastEl).show();

          setTimeout(() => window.location.reload(), 2000);
        })
        .catch(err => {
          const toastEl = document.getElementById('toastCarrello');
          toastEl.querySelector('.toast-body').textContent = err.message;

          toastEl.classList.remove('bg-success');
          toastEl.classList.add('bg-danger');

          new bootstrap.Toast(toastEl).show();
        });
      bootstrap.Modal.getInstance(document.getElementById('confermaModal'))?.hide();
    });
  });
</script>
<div th:replace="~{Modali/ModaleConfermaAnnulla :: ModaleConfermaAnnulla}"></div>
<div th:replace="~{Modali/ModaleErroreOSuccesso :: ModaleErroreOSuccesso}"></div>
</body>
</html>
