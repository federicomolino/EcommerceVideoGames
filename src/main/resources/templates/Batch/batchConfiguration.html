<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Configuration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <meta charset="UTF-8">

    <style>
        .batch-header .arrow {
    transition: transform 0.3s;
    }

    .batch-header[aria-expanded="true"] .arrow {
        transform: rotate(180deg);
    }
    </style>
</head>
<body>
<!--importo navbar-->
<div th:replace="~{navbar/navbar :: sidebar}">
    <div th:fragment="content">
        <div class="container p-5">
            <div class="card text-bg-light mb-3" style="max-width: 18rem;">
                <div class="card-header"><i class="bi bi-person-circle"></i>&nbsp; Intestazione</div>
                <div class="card-body" style="width: 18rem;">
                    <ul class="list-group list-group-flush">
                        <div class="d-flex justify-content-between">
                            <h5 class="card-title">I Miei Dati</h5>
                            <a th:href="@{'/login/editUser'}" class="link-underline-light text-black">
                                <i class="bi bi-pencil-square">&nbsp;Modifica</i>
                            </a>
                        </div>
                        <div>
                            <li class="list-group-item">Nome : <strong th:text="${nomeUtente}">Federico</strong></li>
                            <li class="list-group-item">Cognome : <strong th:text="${cognomeUtente}">Federico</strong></li>
                            <li class="list-group-item">Username : <strong th:text="${usernameUtente}">Federico</strong></li>
                        </div>
                    </ul>
                </div>
            </div>

            <div class="batch-header d-flex align-items-center"
                 data-bs-toggle="collapse"
                 data-bs-target="#collapseBatch"
                 role="button">

                <h5><strong>Batch</strong></h5>
                <i class="bi bi-chevron-down ms-auto arrow"></i>
            </div>

            <div class="collapse" id="collapseBatch">
                <div th:if="${lstBatch.isEmpty}">
                    <div class="alert alert-warning text-center">
                        Nessun Batch Presente
                    </div>
                </div>

                <div th:unless="${lstBatch.isEmpty}"  th:each="batch : ${lstBatch}" >
                    <div class="card card-body mt-1">
                        <div class="d-flex">
                            <div class="col-3">
                                <div class="d-flex">
                                    <strong>NomeBatch</strong>
                                </div>
                                <label th:text="${batch.nomeBatch}">Nome</label>
                            </div>

                            <div class="col-3">
                                <div class="d-flex">
                                    <strong>Ultimo Giro</strong>
                                </div>
                                <label th:text="${#temporals.format(batch.ultimoGiroBatch, 'dd/MM/yyyy HH:mm')}">Ultimo Giro</label>
                            </div>

                            <div class="col-3">
                                <div class="d-flex flex-column align-items-center">

                                    <strong>Attivo</strong>

                                    <form th:action="@{/configuration/batch/toggle}" method="post" class="mt-2">
                                        <input type="hidden" name="idBatch" th:value="${batch.idBatch}" />
                                        <button type="submit"
                                                class="btn btn-link p-0 border-0 d-flex justify-content-center align-items-center">

                                            <i th:unless="${batch.isAttivo}"
                                               class="bi bi-stop-circle-fill text-danger"
                                               title="Batch Spento"></i>

                                            <i th:if="${batch.isAttivo}"
                                               class="bi bi-play-circle-fill text-success"
                                               title="Batch Attivo"></i>
                                        </button>
                                    </form>

                                </div>
                            </div>

                            <div class="col-1 text-center">
                                <div class="d-flex flex-column align-items-center">
                                    <strong>Elimina</strong>

                                    <form id="formEliminaBatch" th:action="@{/configuration/batch/eliminaBatch}" method="post" class="mt-2">
                                        <input type="hidden" name="idBatch" th:value="${batch.idBatch}" />

                                        <button type="button"
                                                class="btn btn-link p-0 border-0 d-flex justify-content-center align-items-center"
                                                data-bs-toggle="modal"
                                                data-bs-target="#confermaModal"
                                                data-body="Vuoi procedere con l'eliminazione del batch?">
                                            <i class="bi bi-trash-fill text-danger"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Scripts/ModaleConfermaScriptBase.js"></script>
<div th:replace="~{Modali/ModaleConfermaAnnulla :: ModaleConfermaAnnulla}"></div>
</body>
</html>
