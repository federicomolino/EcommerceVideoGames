<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Navbar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/Navbar.css">
</head>
<body>
<div th:fragment="sidebar">
  <div class="d-flex vh-100">

    <!-- Sidebar -->
    <nav id="sidebarMenu" class="bg-primary text-white p-3 collapse d-lg-block" style="width: 250px;">
      <a class="navbar-brand text-white font-weight-bold d-block mb-4" href="/">MyShop</a>

      <ul class="nav flex-column">
        <!-- Home -->
        <li class="nav-item mb-2">
          <a class="nav-link text-white" href="/" title="Home">
            <i class="bi bi-house"></i>
            Home
          </a>
        </li>

        <!-- Registrati (solo utenti non guest) -->
        <li class="nav-item mb-2" sec:authorize="!hasAuthority('GUEST')">
          <a class="nav-link text-white" href="/login/register" title="Nuovo utente">
            <i class="bi bi-person-plus"></i>
            Registrati
          </a>
        </li>

        <!-- Carrello (solo utenti non guest) -->
        <li class="nav-item mb-2" sec:authorize="!hasAuthority('GUEST')">
          <a class="nav-link text-white" href="/carrello" title="Carrello">
            <i class="bi bi-cart"></i>
            Carrello
          </a>
        </li>

        <!-- Preferiti -->
        <li class="nav-item mb-2" sec:authorize="!hasAuthority('GUEST')">
          <a class="nav-link text-white" href="/Preferiti" title="Logout">
            <i class="bi bi-bookmark-star"></i>
            Preferiti
          </a>
        </li>

        <!-- Logout -->
        <li class="nav-item mb-2">
          <a class="nav-link text-white" href="/logout" title="Logout">
            <i class="bi bi-box-arrow-in-left"></i>
            Logout
          </a>
        </li>

      </ul>
    </nav>

    <!-- Contenuto principale -->
    <div class="flex-grow-1 p-3">
      <!-- Bottone hamburger per mobile -->
      <button class="btn btn-primary d-lg-none mb-3" type="button"
              data-bs-toggle="collapse" data-bs-target="#sidebarMenu"
              aria-controls="sidebarMenu" aria-expanded="false">
        <i class="bi bi-list"></i> Menu
      </button>

      <!-- Qui Thymeleaf inserirà il contenuto della pagina -->
      <div th:insert="~{::content}"></div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
